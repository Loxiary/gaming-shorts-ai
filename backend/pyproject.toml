[project]
name = "gaming-shorts-ai-backend"
version = "0.1.0"
description = "Gaming Shorts AI — backend local (Phase 1 : fondations)"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "BLE"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
known-third-party = ["alembic"]  # le dossier local alembic/ ne doit pas masquer le paquet

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
# En-têtes ASS : lignes de format imposées par la spécification, non découpables.
"app/render/subtitles.py" = ["E501"]
